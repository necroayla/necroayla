<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Laboratório da Ayla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style id="css">
/* Layout: blog com barra lateral de pastas à esquerda e conteúdo à direita. Água com bolhas e peixinhos atrás do conteúdo; sapinhos e borboletas por cima. */
:root {
  --bg: #E7F0EB;
  --grid: #DAE7E0;
  --surface: #F7FBF9;
  --panel: #D6E6DD;
  --ink: #1D2A2C;
  --muted: #4B6163;
  --line: #1D2A2C;
  --shadow: #B4CFC1;
  --grass: #9AD6AE;
  --frog: #4FB477;
  --frog-ink: #1B6A3E;
  --pink: #E8789A;
  --sun: #F2C14E;
  --sky: #5FAEDD;
  --danger: #B63A58;
  --code-bg: #1D2A2C;
  --code-fg: #DDEBE5;
  --f-display: 'Pixelify Sans', 'Courier New', monospace;
  --f-body: 'DM Sans', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A1C; --grid: #172427; --surface: #182326; --panel: #1F2E31;
    --ink: #E5F0EB; --muted: #9BB1AF; --line: #6F9399; --shadow: #0A1112;
    --grass: #2E5A43; --frog-ink: #86E3A8; --danger: #F07D98; --code-bg: #0B1213; --code-fg: #D5E5DE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A1C; --grid: #172427; --surface: #182326; --panel: #1F2E31;
  --ink: #E5F0EB; --muted: #9BB1AF; --line: #6F9399; --shadow: #0A1112;
  --grass: #2E5A43; --frog-ink: #86E3A8; --danger: #F07D98; --code-bg: #0B1213; --code-fg: #D5E5DE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 16px/1.6 var(--f-body);
}
canvas { image-rendering: pixelated; display: block; }
a { color: var(--frog-ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }

#water { position: fixed; left: 0; top: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#butterflies { position: fixed; inset: 0; pointer-events: none; z-index: 20; overflow: hidden; }
#butterflies canvas { position: absolute; left: 0; top: 0; will-change: transform; }

/* estrutura */
.shell {
  position: relative; z-index: 1;
  max-width: 1180px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 0;
  display: grid;
  grid-template-columns: 260px minmax(0, 1fr);
  grid-template-areas: "top top" "side main" "foot foot";
  column-gap: 28px;
}
body.has-bar .shell { padding-bottom: 96px; }
.top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 10px 20px; flex-wrap: wrap; padding-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 20px var(--f-display); text-decoration: none; color: var(--ink); }
.top-actions { display: flex; gap: 10px; align-items: center; }
[hidden] { display: none !important; }
.top .menu-btn { display: none; }
.side {
  grid-area: side; align-self: start; min-width: 0;
  position: sticky; top: calc(12px + env(safe-area-inset-top, 0px));
  max-height: calc(100vh - 24px); overflow: auto;
  background: var(--surface); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 12px;
}
.side nav { display: grid; gap: 2px; }
.side a { text-decoration: none; color: var(--ink); }
.nav-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border: 2px solid transparent; font-size: 15px; }
.nav-link:hover { border-color: var(--line); }
.nav-link.on { background: var(--frog); color: #1D2A2C; border-color: var(--line); }
.nav-link small, .fold-row small { font: 12px var(--f-mono); opacity: .75; }
.side-title { font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 8px 4px; }
.fold-row { display: flex; align-items: center; gap: 2px; }
.fold-row a { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 5px 6px; border: 2px solid transparent; font-size: 15px; }
.fold-row a span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fold-row a:hover { border-color: var(--line); }
.fold-row a.on { background: var(--panel); border-color: var(--line); }
.chev { flex: none; width: 24px; height: 28px; border: 0; background: none; cursor: pointer; position: relative; }
.chev::before { content: ''; position: absolute; left: 8px; top: 9px; border: 5px solid transparent; border-left: 7px solid var(--ink); }
.chev[aria-expanded="true"]::before { left: 6px; top: 11px; transform: rotate(90deg); }
.pages { list-style: none; margin: 0 0 6px 26px; padding: 0; display: grid; gap: 1px; border-left: 2px solid var(--line); }
.pages a { display: block; padding: 3px 8px; font-size: 14px; border: 2px solid transparent; overflow-wrap: anywhere; }
.pages a:hover { border-color: var(--line); }
.pages a.on { background: var(--frog); color: #1D2A2C; border-color: var(--line); }
.side .btn { margin-top: 12px; width: 100%; }
#main { grid-area: main; min-width: 0; padding-bottom: 24px; }
.footwrap { grid-area: foot; }

/* botões e campos */
.btn {
  font: 600 14px var(--f-mono); text-decoration: none; color: var(--ink);
  background: var(--surface); border: 2px solid var(--line); padding: 8px 14px;
  box-shadow: 3px 3px 0 var(--shadow); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  transition: transform .1s steps(2), box-shadow .1s steps(2);
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--shadow); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--shadow); }
.btn.primary { background: var(--frog); color: #1D2A2C; }
.btn.small { font-size: 12.5px; padding: 4px 10px; box-shadow: 2px 2px 0 var(--shadow); }
.btn.danger { color: var(--danger); }
input[type=text], input[type=date], input[type=number], select, textarea {
  font: inherit; color: var(--ink); background: var(--bg); border: 2px solid var(--line);
  padding: 7px 10px; width: 100%; min-width: 0; border-radius: 0;
}
textarea { resize: vertical; line-height: 1.6; min-height: 84px; }
textarea.code { font: 13px/1.6 var(--f-mono); tab-size: 2; white-space: pre; overflow-x: auto; }
label.f { display: grid; gap: 4px; font: 600 12px var(--f-mono); color: var(--muted); min-width: 0; }

/* cartões e janelas */
.card { background: var(--surface); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 16px; min-width: 0; }
a.card { display: block; text-decoration: none; color: var(--ink); transition: transform .12s steps(2), box-shadow .12s steps(2); }
a.card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--shadow); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 18px; }
.win { background: var(--surface); border: 2px solid var(--line); box-shadow: 6px 6px 0 var(--shadow); min-width: 0; }
.wbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 2px solid var(--line); font: 12px var(--f-mono); color: var(--muted); }
.wbar i { width: 10px; height: 10px; display: block; border: 2px solid var(--line); }
.wbar i:nth-child(1) { background: var(--pink); } .wbar i:nth-child(2) { background: var(--sun); } .wbar i:nth-child(3) { background: var(--frog); }
.wbar span { margin-left: 6px; }
.scene { position: relative; height: 220px; overflow: hidden; background: var(--panel); }
.scene .robot { position: absolute; left: max(68px, 20%); bottom: 40px; transform: translateX(-50%); }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: var(--grass); border-top: 2px solid var(--line); }
.ground canvas { position: absolute; bottom: 100%; margin-bottom: -2px; }
.lane { position: absolute; left: 0; right: 0; bottom: 40px; height: 44px; pointer-events: none; }
.walker { position: absolute; left: 0; bottom: 0; pointer-events: auto; cursor: pointer; will-change: transform; }
.bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 6px; background: var(--surface); border: 2px solid var(--line); font: 600 11px var(--f-mono); padding: 1px 6px; white-space: nowrap; opacity: 0; pointer-events: none; color: var(--ink); }
.bubble.on { opacity: 1; }
.foot { position: relative; height: 84px; margin-top: 28px; }
.foot .ground { height: 24px; }
.foot .lane { bottom: 24px; }

/* início */
.hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 26px; align-items: center; padding-block: 4px 34px; }
.hero h1 { font-size: clamp(32px, 5vw, 48px); }
.hero h1 mark { background: linear-gradient(transparent 62%, color-mix(in srgb, var(--frog) 55%, transparent) 62%); color: inherit; }
.lead { max-width: 52ch; color: var(--muted); font-size: 17px; margin: 14px 0 20px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.term { margin-top: 22px; background: var(--code-bg); color: var(--code-fg); font: 13px/1.7 var(--f-mono); padding: 12px 14px; border: 2px solid var(--line); max-width: 52ch; overflow-wrap: anywhere; }
.term .dim { color: #86A19B; } .term .ok { color: #86E3A8; }
.cur { display: inline-block; width: 8px; height: 14px; background: var(--code-fg); vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
section.sec { padding-block: 22px 4px; }
.sec-head { margin-bottom: 16px; }
.sec-head h2 { font-size: 26px; }
.sec-head p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.fcard { display: flex; flex-direction: column; gap: 6px; }
.fcard h3 { font-size: 19px; }
.fcard p { margin: 0; color: var(--muted); font-size: 14px; }
.rows { display: grid; gap: 10px; }
.row { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; padding: 10px 14px; background: var(--surface); border: 2px solid var(--line); text-decoration: none; color: var(--ink); }
.row:hover { box-shadow: 3px 3px 0 var(--shadow); }
.row b { font: 700 17px var(--f-display); flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.row span { font: 12.5px var(--f-mono); color: var(--muted); }
.row p { flex-basis: 100%; margin: 0; font-size: 14px; color: var(--muted); }
.empty { padding: 18px; border: 2px dashed var(--line); background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--muted); }

/* páginas */
.head { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
.head h1 { font-size: clamp(28px, 4.5vw, 40px); overflow-wrap: anywhere; }
.crumb { font: 13px var(--f-mono); }
.meta { font: 13px var(--f-mono); color: var(--muted); }
.title-input { font: 700 26px var(--f-display); }
.head-edit { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; align-items: end; margin-top: 6px; }
.blk { margin: 0 0 20px; min-width: 0; }
.blk p { max-width: 68ch; margin: 0 0 1em; }
.blk p:last-child { margin-bottom: 0; }
.blk h2 { font-size: 24px; margin-top: 10px; }
.edit .blk { border: 2px dashed var(--line); padding: 10px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; font: 12px var(--f-mono); color: var(--muted); }
.tools .sp { flex: 1; }
.fig { margin: 0; }
.fig img { display: block; max-width: 100%; max-height: 560px; width: auto; height: auto; border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); background: var(--panel); }
.fig figcaption { font: 13px var(--f-mono); color: var(--muted); margin-top: 8px; max-width: 68ch; }
.check { background: var(--surface); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 14px; max-width: 580px; }
.check h3 { font-size: 18px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.check h3 small { font: 12px var(--f-mono); color: var(--muted); }
.check ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.check li { display: flex; gap: 10px; align-items: center; min-width: 0; }
.check li.done span.t { text-decoration: line-through; color: var(--muted); }
.check li span.t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.cb { flex: none; width: 20px; height: 20px; border: 2px solid var(--line); background: var(--bg); position: relative; display: block; padding: 0; }
button.cb { cursor: pointer; }
.cb.on { background: var(--frog); }
.cb.on::after { content: ''; position: absolute; left: 5px; top: 0; width: 5px; height: 10px; border: solid #1D2A2C; border-width: 0 3px 3px 0; transform: rotate(45deg); }
.codebox { border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); background: var(--code-bg); max-width: 100%; }
.codebox header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-bottom: 2px solid var(--line); color: var(--code-fg); font: 600 12px var(--f-mono); }
.codebox pre { margin: 0; padding: 12px; overflow-x: auto; color: var(--code-fg); font: 12.5px/1.6 var(--f-mono); tab-size: 2; max-height: 520px; }
.codebox .btn { color: var(--ink); }
.addbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border: 2px dashed var(--line); align-items: center; }
.addbar span { font: 600 12px var(--f-mono); color: var(--muted); margin-right: 4px; }
.items-edit { display: grid; gap: 8px; margin-top: 10px; }
.items-edit li { display: flex; gap: 8px; align-items: center; }

/* estudos */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat b { display: block; font: 700 26px var(--f-display); }
.stat span { font: 12px var(--f-mono); color: var(--muted); }
.chart { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; height: 150px; margin-top: 10px; }
.col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; min-width: 0; }
.col i { display: block; width: 100%; max-width: 40px; background: var(--frog); border: 2px solid var(--line); min-height: 4px; }
.col i.zero { background: var(--bg); }
.col small { font: 11px var(--f-mono); color: var(--muted); }
.col em { font: normal 11px var(--f-mono); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
.form-grid .wide { grid-column: 1 / -1; }
.day { margin-top: 22px; }
.day h3 { font-size: 17px; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.day h3 span { display: inline-block; }
.day h3 span::first-letter { text-transform: uppercase; }
.day h3 small { font: 12px var(--f-mono); color: var(--muted); text-transform: none; }
.ent { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; padding: 8px 12px; margin-top: 8px; background: var(--surface); border: 2px solid var(--line); }
.ent b { flex: 1 1 160px; min-width: 0; overflow-wrap: anywhere; }
.pill { color: #1D2A2C; background: var(--sun); font: 600 12px var(--f-mono); padding: 1px 8px; border: 2px solid var(--line); white-space: nowrap; }
.ent p { flex-basis: 100%; margin: 0; font-size: 14px; color: var(--muted); }

/* barra de edição */
.ebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface); border-top: 2px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 10px 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.ebar p { margin: 0; font: 13px var(--f-mono); flex: 1 1 220px; min-width: 0; }
.ebar .dot { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line); background: var(--frog); margin-right: 8px; }
.ebar .dot.dirty { background: var(--sun); }
.ebar div { display: flex; gap: 10px; flex-wrap: wrap; }

footer { padding-block: 0 max(28px, env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; font: 13px var(--f-mono); color: var(--muted); }
footer p { margin: 0; }
footer strong { color: var(--ink); font-weight: 600; user-select: all; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "side" "main" "foot"; }
  .side { position: static; display: none; max-height: none; margin-bottom: 20px; }
  .side.open { display: block; }
  .top .menu-btn { display: inline-flex; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .cur { animation: none; }
  a.card, .btn { transition: none; }
}
</style>

".wav\", \".flac\"]\n}\n\ndef organizar_pasta(caminho_pasta):\n    pasta_target = Path(caminho_pasta)\n\n    if not pasta_target.exists():\n        print(f\"Erro: O caminho '{caminho_pasta}' não existe.\")\n        return\n\n    for arquivo in pasta_target.iterdir():\n        if arquivo.is_dir():\n            continue\n\n        extensao = arquivo.suffix.lower()\n        moved = False\n\n        for categoria, extensoes in CATEGORIAS.items():\n            if extensao in extensoes:\n                pasta_destino = pasta_target / categoria\n                pasta_destino.mkdir(exist_ok=True)\n\n                shutil.move(str(arquivo), str(pasta_destino / arquivo.name))\n                print(f\"Movido: {arquivo.name} -\u003e {categoria}/\")\n                moved = True\n                break\n\n        if not moved and extensao != \"\":\n            pasta_outros = pasta_target / \"Outros\"\n            pasta_outros.mkdir(exist_ok=True)\n            shutil.move(str(arquivo), str(pasta_outros / arquivo.name))\n            print(f\"Movido: {arquivo.name} -\u003e Outros/\")\n\nif __name__ == \"__main__\":\n    pasta_para_organizar = Path.home() / \"Downloads\"\n    print(f\"Organizando a pasta: {pasta_para_organizar}\")\n    organizar_pasta(pasta_para_organizar)\n    print(\"Organização concluída!\")"}]}, {"id": "maos", "folderId": "visao", "title": "Detector de mãos com MediaPipe", "created": "2026-11-16", "updated": "2026-11-16", "blocks": [{"type": "text", "text": "Projeto web que abre a webcam e desenha o esqueleto das mãos em vermelho por cima do vídeo, usando o HandLandmarker do MediaPipe (até 2 mãos).\n\nA ideia inicial era fazer uma expansão de domínio do Jujutsu Kaisen. Primeiro vou melhorar o detector. O pacote three está nas dependências, mas ainda não entrou no código."}, {"type": "check", "title": "Para melhorar", "items": [{"t": "Desenhar o esqueleto das mãos na webcam", "d": true}, {"t": "Reconhecer o gesto da expansão de domínio", "d": false}, {"t": "Mostrar uma mensagem na tela quando o gesto for feito", "d": false}]}, {"type": "heading", "text": "index.html"}, {"type": "code", "lang": "html", "text": "\u003c!doctype html\u003e\n\u003chtml lang=\"pt-BR\"\u003e\n\u003chead\u003e\n    \u003cmeta charset=\"UTF-8\"\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\u003e\n    \u003ctitle\u003eDetecta maos\u003c/title\u003e\n    \u003cstyle\u003e\n        html, body {\n            margin: 0;\n            padding: 0;\n            width: 100%;\n            height: 100%;\n            overflow: hidden;\n            background: black;\n        }\n\n        #webcam {\n            position: fixed;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            object-fit: cover;\n            z-index: 1;\n        }\n\n        #canvas {\n            position: fixed;\n            top: 0;\n            left: 0;\n            width: 100%;\n            height: 100%;\n            pointer-events: none;\n            z-index: 2;\n            background: transparent;\n        }\n    \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n    \u003cvideo id=\"webcam\" autoplay playsinline\u003e\u003c/video\u003e\n    \u003ccanvas id=\"canvas\"\u003e\u003c/canvas\u003e\n    \u003cscript type=\"module\" src=\"/src/main.js\"\u003e\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e"}, {"type": "heading", "text": "src/main.js"}, {"type": "code", "lang": "javascript", "text": "import {\n    HandLandmarker,\n    FilesetResolver\n} from \"@mediapipe/tasks-vision\";\n\nconst video = document.getElementById(\"webcam\");\nconst canvas = document.getElementById(\"canvas\");\nconst ctx = canvas.getContext(\"2d\");\n\nconst conexoesMaos = [\n    [0, 1], [1, 2], [2, 3], [3, 4],\n    [0, 5], [5, 6], [6, 7], [7, 8],\n    [0, 9], [9, 10], [10, 11], [11, 12],\n    [0, 13], [13, 14], [14, 15], [15, 16],\n    [0, 17], [17, 18], [18, 19], [19, 20],\n    [5, 9],\n    [9, 13],\n    [13, 17]\n];\n\nlet handLandmarker = null;\n\nfunction desenharEsqueleto(marcos) {\n    for (const mao of marcos) {\n        ctx.strokeStyle = \"#ff0000\";\n        ctx.lineWidth = 3;\n        ctx.shadowColor = \"#ff0000\";\n        ctx.shadowBlur = 10;\n\n        for (const conexao of conexoesMaos) {\n            const pontoA = mao[conexao[0]];\n            const pontoB = mao[conexao[1]];\n\n            const xA = pontoA.x * canvas.width;\n            const yA = pontoA.y * canvas.height;\n            const xB = pontoB.x * canvas.width;\n            const yB = pontoB.y * canvas.height;\n\n            ctx.beginPath();\n            ctx.moveTo(xA, yA);\n            ctx.lineTo(xB, yB);\n            ctx.stroke();\n        }\n\n        for (const ponto of mao) {\n            const x = ponto.x * canvas.width;\n            const y = ponto.y * canvas.height;\n\n            ctx.beginPath();\n            ctx.arc(x, y, 6, 0, Math.PI * 2);\n            ctx.fillStyle = \"#ff0000\";\n            ctx.shadowColor = \"#ff0000\";\n            ctx.shadowBlur = 15;\n            ctx.fill();\n        }\n    }\n\n    ctx.shadowBlur = 0;\n}\n\nfunction ajustarCanvas() {\n    canvas.width = window.innerWidth;\n    canvas.height = window.innerHeight;\n}\n\najustarCanvas();\nwindow.addEventListener(\"resize\", ajustarCanvas);\n\nasync function iniciarCamera() {\n    try {\n        const stream = await navigator.mediaDevices.getUserMedia({\n            video: true,\n            audio: false\n        });\n\n        video.srcObject = stream;\n        video.addEventListener(\"loadeddata\", iniciarMediaPipe);\n    } catch (erro) {\n        console.error(\"Erro ao acessar a câmera:\", erro);\n    }\n}\n\nasync function iniciarMediaPipe() {\n    console.log(\"Iniciando MediaPipe...\");\n\n    const vision = await FilesetResolver.forVisionTasks(\n        \"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm\"\n    );\n\n    handLandmarker = await HandLandmarker.createFromOptions(vision, {\n        baseOptions: {\n            modelAssetPath:\n                \"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task\",\n            delegate: \"GPU\"\n        },\n        runningMode: \"VIDEO\",\n        numHands: 2\n    });\n\n    console.log(\"MediaPipe iniciado!\");\n    detectarMaos();\n}\n\nfunction detectarMaos() {\n    if (!handLandmarker) {\n        requestAnimationFrame(detectarMaos);\n        return;\n    }\n\n    const agora = performance.now();\n    const resultado = handLandmarker.detectForVideo(video, agora);\n\n    ctx.clearRect(0, 0, canvas.width, canvas.height);\n\n    if (resultado.landmarks \u0026\u0026 resultado.landmarks.length \u003e 0) {\n        desenharEsqueleto(resultado.landmarks);\n    }\n\n    requestAnimationFrame(detectarMaos);\n}\n\niniciarCamera();"}, {"type": "heading", "text": "package.json"}, {"type": "code", "lang": "json", "text": "{\n  \"name\": \"jujutsuholgram\",\n  \"version\": \"0.0.0\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"vite build\",\n    \"preview\": \"vite preview\"\n  },\n  \"devDependencies\": {\n    \"vite\": \"^8.2.0\"\n  },\n  \"dependencies\": {\n    \"@mediapipe/tasks-vision\": \"^1.0.1\",\n    \"three\": \"^0.185.1\"\n  }\n}"}]}, {"id": "comecando", "folderId": "assistente", "title": "Começando o assistente de IA", "created": "2026-11-17", "updated": "2026-11-17", "blocks": [{"type": "text", "text": "Quero construir um assistente de IA aos poucos e documentar cada passo aqui. Esta pasta vai guardando o que eu for fazendo, uma página por etapa."}, {"type": "check", "title": "Primeiros passos", "items": [{"t": "Definir o que o assistente vai fazer", "d": false}, {"t": "Escolher a linguagem e as bibliotecas", "d": false}, {"t": "Fazer um primeiro protótipo", "d": false}, {"t": "Documentar cada etapa aqui", "d": false}]}]}], "study": []}</script>

/* ---------- água: bolhas subindo e peixinhos por perto ---------- */
var SC = 3, LW = 0, LH = 0, wctx = null, streams = [], waterEl = null;
function spawnBubble(s, yy) {
  var r = 1 + Math.floor(Math.random() * 3);
  s.b.push({ x0: s.x + rand(-5, 5), x: s.x, y: yy == null ? LH + 6 : yy, r: r, sp: 7 + r * 3 + rand(0, 4), f: rand(0.8, 1.8), ph: rand(0, 6.28), a: rand(1, 2.6) });
}
function initWater() {
  LW = Math.ceil(window.innerWidth / SC); LH = Math.ceil(window.innerHeight / SC);
  waterEl.width = LW; waterEl.height = LH;
  wctx = waterEl.getContext('2d'); wctx.imageSmoothingEnabled = false;
  var fr = window.innerWidth < 700 ? [0.3, 0.82] : [0.34, 0.62, 0.9];
  streams = fr.map(function (f, i) {
    var fp = FISH_PALS[i % FISH_PALS.length];
    var s = {
      x: Math.round(LW * f), b: [], next: 0,
      fishFrames: [build([FISH_A], fp, 1).frames[0], build([FISH_B], fp, 1).frames[0]],
      fish: { x: Math.round(LW * f), y: LH * 0.7, tx: 0, ty: 0, next: 0, face: 1 }
    };
    for (var k = 0; k < 9; k++) spawnBubble(s, rand(0, LH));
    s.fish.tx = s.x; s.fish.ty = LH * 0.7;
    return s;
  });
}
function waterLoop() {
  var last = performance.now();
  return function (now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    wctx.clearRect(0, 0, LW, LH);
    streams.forEach(function (s) {
      if (now >= s.next) { spawnBubble(s); s.next = now + rand(500, 1300); }
      for (var i = s.b.length - 1; i >= 0; i--) {
        var b = s.b[i];
        b.y -= b.sp * dt;
        b.x = b.x0 + Math.sin(now / 1000 * b.f + b.ph) * b.a;
        if (b.y < -8) { s.b.splice(i, 1); continue; }
        var sz = BUB_SIZE[b.r - 1];
        wctx.drawImage(BUB_FRAMES[b.r - 1], Math.round(b.x - sz / 2), Math.round(b.y - sz / 2));
      }
      var f = s.fish;
      if (now >= f.next) {
        var low = s.b.filter(function (b) { return b.y > LH * 0.25 && b.y < LH * 0.95; });
        if (low.length) {
          var pick = low[Math.floor(Math.random() * low.length)];
          f.tx = pick.x + rand(-12, 12); f.ty = pick.y + rand(-3, 9);
        } else { f.tx = s.x + rand(-12, 12); f.ty = LH * 0.7; }
        f.tx = Math.max(s.x - 22, Math.min(s.x + 22, f.tx));
        f.ty = Math.max(10, Math.min(LH - 10, f.ty));
        f.next = now + rand(2200, 4200);
      }
      var dx = f.tx - f.x;
      if (Math.abs(dx) > 1.5) f.face = dx > 0 ? 1 : -1;
      f.x += dx * dt * 0.8; f.y += (f.ty - f.y) * dt * 0.8;
      wctx.save();
      wctx.translate(Math.round(f.x), Math.round(f.y + Math.sin(now / 700 + s.x) * 1.2));
      if (f.face > 0) wctx.scale(-1, 1);
      wctx.drawImage(s.fishFrames[Math.floor(now / 260) % 2], -5, -2);
      wctx.restore();
    });
  };
}

/* ---------- borboletas ---------- */
function butterflies(layer) {
  if (reduce) { layer.hidden = true; return; }
  var W = window.innerWidth, H = window.innerHeight;
  window.addEventListener('resize', function () { W = window.innerWidth; H = window.innerHeight; });
  BF_PALS.slice(0, W < 600 ? 2 : 3).forEach(function (pal) {
    var s = build([BF_OPEN, BF_CLOSED], pal, 3);
    layer.append(s);
    var x = rand(40, W - 80), y = rand(80, H - 80), ang = rand(0, 6.28), seed = rand(0, 100), speed = rand(22, 34), last = performance.now();
    loops.push(function (now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      var t = now / 1000;
      ang += (Math.sin(t * 0.9 + seed) + 0.5 * Math.sin(t * 2.3 + seed * 2)) * dt * 1.6;
      if (x < 50 || x > W - 80 || y < 60 || y > H - 60) {
        var want = Math.atan2(H / 2 - y, W / 2 - x);
        var diff = Math.atan2(Math.sin(want - ang), Math.cos(want - ang));
        ang += diff * dt * 2.2;
      }
      x += Math.cos(ang) * speed * dt;
      y += Math.sin(ang) * speed * dt + Math.sin(t * 5 + seed) * 0.25;
      s.show(Math.floor(now / (170 + (seed % 60))) % 2);
      s.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0)';
    });
  });
}

    h('div', { class: 'stat' }, h('b', { text: String(streak()) }), h('span', { text: streak() === 1 ? 'dia seguido' : 'dias seguidos' })))));

function viewFolder(f) {

    h('span', { class: 'meta', text: list.length + (list.length === 1 ? ' página' : ' páginas') }));
  box.append(head);

    return h('a', { class: 'row', href: '#p-' + p.id }, h('b', { text: p.title }), h('span', { text: dLong(p.created) }), snippet(p) ? h('p', { text: snippet(p) }) : null);
  })));
  else box.append(h('div', { class: 'empty', text: 'Esta pasta ainda não tem páginas.' }));

function viewPage(p) {

  var head = h('div', { class: 'head' },
    h('span', { class: 'crumb' }, h('a', { href: '#inicio', text: 'Início' }), ' / ', f ? h('a', { href: '#f-' + f.id, text: f.name }) : 'sem pasta'));

      h('div', { class: 'head-edit' },
        h('label', { class: 'f' }, 'Data em que escrevi', h('input', { type: 'date', value: p.created, onchange: function () { if (this.value) { p.created = this.value; changed(p); renderSide(route()); } } })),
        h('label', { class: 'f' }, 'Pasta', h('select', { value: p.folderId, onchange: function () { p.folderId = this.value; openSet[this.value] = true; changed(p); render(); } },
          S.folders.map(function (x) { return h('option', { value: x.id, text: x.name }); }))),

  p.blocks.forEach(function (b, i) { box.append(renderBlock(p, b, i)); });
  if (editing) box.append(h('div', { class: 'addbar' }, h('span', { text: 'Adicionar:' }),
    h('button', { class: 'btn small', type: 'button', text: '+ título', onclick: function () { addBlock(p, 'heading'); } }),
    h('button', { class: 'btn small', type: 'button', text: '+ texto', onclick: function () { addBlock(p, 'text'); } }),
    h('button', { class: 'btn small', type: 'button', text: '+ foto', onclick: function () { pickImage(p, null); } }),
    h('button', { class: 'btn small', type: 'button', text: '+ checklist', onclick: function () { addBlock(p, 'check'); } }),
    h('button', { class: 'btn small', type: 'button', text: '+ código', onclick: function () { addBlock(p, 'code'); } })));

}

function viewStudy() {
  var box = h('div');
  box.append(h('div', { class: 'head' }, h('span', { class: 'crumb' }, h('a', { href: '#inicio', text: 'Início' }), ' / diário'),
    h('h1', { text: 'Diário de estudos' }), h('span', { class: 'meta', text: 'O que eu estudei e por quanto tempo.' })));
  box.append(h('div', { class: 'stats' },
    h('div', { class: 'card stat' }, h('b', { text: dur(minutesOn(today())) }), h('span', { text: 'hoje' })),
    h('div', { class: 'card stat' }, h('b', { text: dur(weekTotal()) }), h('span', { text: 'nos últimos 7 dias' })),
    h('div', { class: 'card stat' }, h('b', { text: dur(totalAll()) }), h('span', { text: 'no total' })),
    h('div', { class: 'card stat' }, h('b', { text: String(streak()) }), h('span', { text: streak() === 1 ? 'dia seguido' : 'dias seguidos' }))));

  var t = today(), days = [], mx = 60;
  for (var i = 6; i >= 0; i--) { var d = addDays(t, -i), m = minutesOn(d); days.push({ d: d, m: m }); mx = Math.max(mx, m); }
  var chart = h('div', { class: 'chart', role: 'img', 'aria-label': 'Minutos estudados nos últimos 7 dias: ' + days.map(function (x) { return fmtWk.format(parseD(x.d)) + ' ' + x.m; }).join(', ') });
  days.forEach(function (x) {
    var bar = h('i', { class: x.m ? '' : 'zero' });
    bar.style.height = x.m ? Math.max(4, Math.round(x.m / mx * 100)) + '%' : '4px';
    chart.append(h('div', { class: 'col' }, x.m ? h('em', { text: dur(x.m) }) : null, bar, h('small', { text: fmtWk.format(parseD(x.d)) })));
  });
  box.append(h('div', { class: 'card' }, h('h3', { text: 'Últimos 7 dias', style: 'font-size:17px' }), chart));

  if (editing) {
    var topics = {}; S.study.forEach(function (e) { topics[e.topic] = 1; });
    var form = h('form', { class: 'card', style: 'margin-top:20px', onsubmit: function (ev) {
      ev.preventDefault();
      var topic = $('#st-topic').value.trim(), amt = parseFloat($('#st-amt').value.replace(',', '.')), unit = $('#st-unit').value, date = $('#st-date').value || today();
      if (!topic || !(amt > 0)) { msg = 'Preencha o assunto e o tempo estudado.'; renderBar(); return; }
      S.study.push({ id: uid(), topic: topic, minutes: unit === 'h' ? Math.round(amt * 60) : Math.round(amt), date: date, note: $('#st-note').value.trim() });
      changed(); render();
    } },
      h('h3', { text: 'Registrar estudo', style: 'font-size:17px;margin-bottom:12px' }),
      h('div', { class: 'form-grid' },
        h('label', { class: 'f wide' }, 'Hoje eu estudei', h('input', { type: 'text', id: 'st-topic', list: 'st-topics', placeholder: 'ex.: interrupções no ESP32' })),
        h('label', { class: 'f' }, 'Por quanto tempo', h('input', { type: 'number', id: 'st-amt', min: '1', step: 'any', inputmode: 'decimal', placeholder: '45' })),
        h('label', { class: 'f' }, 'Unidade', h('select', { id: 'st-unit', value: 'min' }, h('option', { value: 'min', text: 'minutos' }), h('option', { value: 'h', text: 'horas' }))),
        h('label', { class: 'f' }, 'Dia', h('input', { type: 'date', id: 'st-date', value: today() })),
        h('label', { class: 'f wide' }, 'Anotação (opcional)', h('input', { type: 'text', id: 'st-note' })),
        h('button', { class: 'btn primary', type: 'submit', text: 'Adicionar' })),
      h('datalist', { id: 'st-topics' }, Object.keys(topics).map(function (k) { return h('option', { value: k }); })));
    box.append(form);
  }

  if (!S.study.length) box.append(h('div', { class: 'empty', style: 'margin-top:20px', text: 'Nenhum registro ainda.' }));
  var dates = {}; S.study.forEach(function (e) { (dates[e.date] = dates[e.date] || []).push(e); });
  Object.keys(dates).sort().reverse().forEach(function (dt) {
    var day = h('div', { class: 'day' }, h('h3', null, h('span', { text: fmtDay.format(parseD(dt)) }), h('small', { text: dur(minutesOn(dt)) })));
    dates[dt].forEach(function (e) {
      day.append(h('div', { class: 'ent' }, h('b', { text: e.topic }), h('span', { class: 'pill', text: dur(e.minutes) }),
        editing ? confirmBtn('apagar', 'certeza?', function () { S.study = S.study.filter(function (x) { return x.id !== e.id; }); changed(); render(); }, 'danger') : null,
        e.note ? h('p', { text: e.note }) : null));
    });
    box.append(day);
  });
  return box;
}

function renderMain(r) {
  var m = els.main;
  m.textContent = '';
  m.classList.toggle('edit', editing);
  var v = r.v === 'page' ? viewPage(page(r.id)) : r.v === 'folder' ? viewFolder(folder(r.id)) : r.v === 'estudos' ? viewStudy() : viewHome();
  m.append(v);
  m.querySelectorAll('textarea.auto').forEach(autosize);
}

/* ---------- publicar ---------- */
function jsonOut(state) { return JSON.stringify(state).replace(/</g, '\\u003c').replace(/>/g, '\\u003e').replace(/&/g, '\\u0026'); }
function buildContent(state) {
  return '<title>' + TITLE + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="' + FONT_URL + '">\n' +
    '<style id="css">' + $('#css').textContent + '</style>\n<div id="root"></div>\n' +
    '<script type="application/json" id="data">' + jsonOut(state) + '</scr' + 'ipt>\n' +
    '<script id="code">' + $('#code').textContent + '</scr' + 'ipt>\n';
}
function nextState() { var c = JSON.parse(JSON.stringify(S)); c.rev = BASE_REV + 1; return c; }
function publish() {
  if (publishing || !artifactNS) return;
  publishing = true; msg = 'Publicando...'; renderBar();
  var html;
  try { html = HEAD_WRAP + buildContent(nextState()) + TAIL_WRAP; } catch (e) { publishing = false; msg = 'Não consegui montar a página.'; renderBar(); return; }
  if (html.length > 15500000) { publishing = false; msg = 'A página ficou grande demais. Apague ou troque fotos grandes.'; renderBar(); return; }
  saveDraft();
  artifactNS.publish(html).then(function () { msg = 'Publicado! Recarregando...'; renderBar(); }, function (e) {
    publishing = false;
    var c = e && e.code;
    msg = c === 'not_writer' || c === 'not_granted' ? 'Esta conta não tem permissão para publicar.'
      : c === 'conflict' ? 'Outra versão foi publicada. A página vai recarregar.'
      : c === 'too_large' ? 'A página ficou grande demais. Apague ou troque fotos grandes.'
      : c === 'rate_limited' ? 'Muitas publicações seguidas. Espere um pouco e tente de novo.'
      : 'Não consegui publicar. Suas alterações continuam salvas aqui; tente de novo.';
    renderBar();
  });
}
function downloadSite() {
  var doc = LOCAL_HEAD + buildContent(nextState()) + TAIL_WRAP;
  var url = URL.createObjectURL(new Blob([doc], { type: 'text/html' }));
  var a = h('a', { href: url, download: 'index.html' });
  document.body.append(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  msg = 'Arquivo baixado. Suba o index.html no seu site para publicar.'; renderBar();
}
function renderBar() {
  var b = els.bar;
  b.textContent = '';
  b.hidden = !editing;
  document.body.classList.toggle('has-bar', !!editing);
  if (!editing) return;
  var status = msg || (dirty ? 'Alterações ainda não publicadas.' : (mode === 'local' ? 'Nada novo para baixar.' : 'Tudo publicado.'));
  var note = mode === 'local' && !msg ? ' As alterações ficam só neste navegador até você baixar o site.' : '';
  b.append(h('p', { role: 'status' }, h('span', { class: 'dot' + (dirty ? ' dirty' : '') }), status + (dirty ? note : '')),
    h('div', null,
      dirty ? confirmBtn('Descartar', 'Descartar tudo?', function () { lsDel(DRAFT_KEY); location.reload(); }, 'danger') : null,
      mode === 'local'
        ? h('button', { class: 'btn primary', type: 'button', text: 'Baixar site atualizado', onclick: downloadSite })
        : h('button', { class: 'btn primary', type: 'button', text: publishing ? 'Publicando...' : 'Publicar', disabled: publishing || !dirty, onclick: publish })));
}

/* ---------- montagem ---------- */
function render() {
  var r = route(), y = window.scrollY, same = r.key === lastKey;
  lastKey = r.key;
  renderTop(); renderSide(r); renderMain(r); renderBar();
  if (same) window.scrollTo(0, y);
  if (pendingFocus) {
    var t = $(pendingFocus); pendingFocus = null;
    if (t) { t.focus(); try { t.scrollIntoView({ block: 'center' }); } catch (e) {} }
  }
}
function boot() {
  var root = $('#root');
  waterEl = h('canvas', { id: 'water', 'aria-hidden': 'true' });
  var fly = h('div', { id: 'butterflies', 'aria-hidden': 'true' });
  els.top = h('header', { class: 'top' });
  els.side = h('aside', { class: 'side', id: 'side', 'aria-label': 'Pastas' });
  els.main = h('main', { id: 'main' });
  els.bar = h('div', { class: 'ebar' }); els.bar.hidden = true;
  var fground = h('div', { class: 'ground' }), flane = h('div', { class: 'lane' });
  decorate(fground);
  var foot = h('div', { class: 'footwrap' },
    h('div', { class: 'foot', 'aria-hidden': 'true' }, fground, flane),
    h('footer', null,
      h('p', { text: 'Feito em protoboard, jumper por jumper.' }),
      h('p', null, 'GitHub: ', h('a', { href: 'https://github.com/necroayla', target: '_blank', rel: 'noopener', text: 'github.com/necroayla' }), ' · e-mail: ', h('strong', { text: 'beatrizayla509@gmail.com' }))));
  root.append(waterEl, fly, h('div', { class: 'shell' }, els.top, els.side, els.main, foot), els.bar);
  window.addEventListener('hashchange', function () { lastKey = null; sideOpen = false; render(); window.scrollTo(0, 0); });
  render();
  requestAnimationFrame(function () { frog(flane, 0.3); });
  butterflies(fly);
  if (!reduce) {
    initWater();
    loops.push(waterLoop());
    var rt = 0;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(initWater, 250); });
  } else waterEl.hidden = true;
  (function tick(now) {
    for (var i = loops.length - 1; i >= 0; i--) if (loops[i](now) === false) loops.splice(i, 1);
    requestAnimationFrame(tick);
  })(performance.now());
}
function enableEditing() {
  var d = lsGet(DRAFT_KEY);
  if (d) {
    try { var o = JSON.parse(d); if (o.baseRev === BASE_REV) { S = o.state; dirty = true; } else lsDel(DRAFT_KEY); } catch (e) { lsDel(DRAFT_KEY); }
  }
  editable = true; editing = lsGet(EDIT_KEY) === '1';
  render();
}
function init() {
  boot();
  var hasClaude = window.claude && typeof window.claude.use === 'function';
  if (!hasClaude) {
    mode = 'local';
    if (/[?&]editar\b/.test(location.search)) enableEditing();
    return;
  }
  mode = 'cloud';
  Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function (r) {
    artifactNS = r[0];
    if (!artifactNS || !r[1]) return false;
    return r[1].canEdit();
  }).then(function (ok) { if (ok) enableEditing(); }, function () {});
}
init();
})();
</script>
